<!DOCTYPE html>

<title>For Shaniii 🌹💖</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
  height:100vh;
  overflow:hidden;
  font-family: 'Courier New', cursive;
  background: radial-gradient(circle at top, #1a0026, #000000);
  color:white;
}

/* Stars */
.star{
  position:absolute;
  background:white;
  border-radius:50%;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle{
  from{opacity:0.3;}
  to{opacity:1;}
}

/* Moon */
.moon{
  position:absolute;
  top:40px;
  right:40px;
  font-size:40px;
}

/* Center */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* Rose */
.rose{
  font-size:90px;
  cursor:pointer;
  animation: glow 2s infinite alternate;
}
@keyframes glow{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

/* Message */
#message{
  margin-top:30px;
  font-size:22px;
  max-width:85%;
  min-height:80px;
}

/* Petals */
.petal{
  position:absolute;
  top:-50px;
  font-size:20px;
  animation:fall linear infinite;
}
@keyframes fall{
  to{ transform:translateY(110vh); }
}

/* Fireworks */
.fire{
  position:absolute;
  font-size:25px;
  animation: explode 1s ease-out forwards;
}
@keyframes explode{
  from{ transform:scale(0); opacity:1;}
  to{ transform:scale(2); opacity:0;}
}

/* Screen glow */
.glowScreen{
  box-shadow:0 0 100px #ff0066 inset;
}
</style>
</head>
