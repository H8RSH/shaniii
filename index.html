<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shaniii 🌹</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', cursive;
  background: radial-gradient(circle at top, #1a0026, #000000);
  color: white;
}

/* Stars */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* Moon */
.moon {
  position: absolute;
  top: 40px;
  right: 40px;
  font-size: 40px;
}

/* Center rose */
.center {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.rose {
  font-size: 90px;
  cursor: pointer;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

/* Message */
#message {
  margin-top: 30px;
  font-size: 22px;
  opacity: 0;
  transition: opacity 2s;
  max-width: 80%;
}

/* Petals */
.petal {
  position: absolute;
  top: -50px;
  font-size: 20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

/* Glow effect */
.glowScreen {
  box-shadow: 0 0 80px #ff0066 inset;
}
</style>
</head>

<body>

<div class="moon">🌙</div>

<div class="center">
  <div class="rose" id="rose">🌹</div>
  <div id="message"></div>
</div>

<audio id="music">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
const rose = document.getElementById("rose");
const message = document.getElementById("message");
const music = document.getElementById("music");

/* Create stars */
for (let i = 0; i < 80; i++) {
  const star = document.createElement("div");
  star.className = "star";
  star.style.width = Math.random() * 3 + "px";
  star.style.height = star.style.width;
  star.style.top = Math.random() * 100 + "vh";
  star.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(star);
}

/* Rose click */
rose.addEventListener("click", () => {
  rose.textContent = "🌹✨";
  document.body.classList.add("glowScreen");

  message.innerHTML =
    "Happy Rose Day Shaniii 🌹💖<br><br>\
    Under this moon and these stars ✨<br>\
    This rose carries all my love for you.<br><br>\
    Always yours ❤️";

  message.style.opacity = "1";
  music.play();
});

/* Falling petals */
function createPetal() {
  const petal = document.createElement("div");
  petal.textContent = "🌸";
  petal.className = "petal";
  petal.style.left = Math.random() * 100 + "vw";
  petal.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(petal);
  setTimeout(() => petal.remove(), 7000);
}

setInterval(createPetal, 400);
</script>

</body>
</html>
