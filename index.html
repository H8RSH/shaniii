<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown begins !  ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: rgba(0,0,0,0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 10px;
    }

    #countdown {
      font-size: 2.5em;
      margin: 20px 0;
    }

    .message {
      font-size: 1.2em;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎂 Countdown to Your Birthday ❤️</h1>
  <div id="countdown"></div>
  <div class="message">Can't wait to celebrate YOU 💖</div>
</div>

<script>
  // Birthday: 5 May 2026
  const birthday = new Date(2026, 4, 5, 0, 0, 0).getTime();

  const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = birthday - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
      days + "d " + hours + "h " + minutes + "m " + seconds + "s";

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "🎉 Happy Birthday ❤️";
    }
  }, 1000);
</script>

</body>
</html>
