<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Something Important ❤️</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        max-width: 400px;
    }

    h1 {
        color: #ff4d6d;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
    }

    #noBtn {
        background-color: #ccc;
        position: absolute;
    }

    #message {
        font-size: 18px;
        margin-top: 20px;
        min-height: 50px;
    }
</style>
</head>
<body>

<div class="card" id="card">
    <h1>Hey ❤️</h1>
    <p>Are you ready for something important?</p>
    <button onclick="startProposal()">Yes 💖</button>
</div>

<script>
function startProposal() {
    document.getElementById("card").innerHTML = `
        <h1 id="typing"></h1>
        <div style="margin-top:20px;">
            <button id="yesBtn" onclick="acceptLove()">Yes 😘</button>
            <button id="noBtn">No 🙈</button>
        </div>
    `;

    let text = "From the moment you came into my life, everything feels different... brighter... happier. So today, on Propose Day, I just want to ask you one thing... Will you be mine forever? 💍❤️";
    let i = 0;
    let speed = 50;

    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

    typeWriter();

    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", function() {
        noBtn.style.top = Math.random() * window.innerHeight + "px";
        noBtn.style.left = Math.random() * window.innerWidth + "px";
    });
}

function acceptLove() {
    document.body.innerHTML = `
        <div style="text-align:center;">
            <h1 style="color:#ff4d6d;">Yayyyy 😍❤️</h1>
            <p style="font-size:20px;">Best decision ever 😌✨</p>
        </div>
    `;
}
</script>

</body>
</html>
